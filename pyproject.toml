[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inflection-detector"
version = "0.0.1"
description = "Point-in-time research system for earnings inflections in Indian listed companies"
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]>=3.1",
    "pdfplumber>=0.10",
    "curl_cffi>=0.10",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
